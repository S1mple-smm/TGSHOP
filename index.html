<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOS Sport Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .swiper-pagination-bullet-active { background-color: #000 !important; }
        input:focus { font-size: 16px; } 
        
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Стили для таблицы размеров */
        .size-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 5px; background: white; }
        .size-table th, .size-table td { border: 1px solid #e5e7eb; padding: 10px 4px; text-align: center; }
        .size-table th { background-color: #f3f4f6; color: #374151; font-weight: 700; text-transform: uppercase; }
        .size-table tr:nth-child(even) { background-color: #f9fafb; }

        /* Адаптивное окно продукта (Мобилка = Modal, ПК = Full Page) */
        .product-view {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: white;
            border-radius: 24px 24px 0 0;
            height: 88vh;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 60;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .product-view.open { transform: translateY(0); }

        @media (min-width: 768px) {
            .product-view {
                top: 0; bottom: 0; left: 0; right: 0;
                height: 100vh;
                border-radius: 0;
                transform: translateY(20px);
                opacity: 0;
                pointer-events: none;
                transition: all 0.3s ease;
                overflow-y: auto;
                display: block; /* Снимаем flex чтобы скроллилась вся страница */
            }
            .product-view.open {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-24 selection:bg-blue-100">

    <!-- Навигация -->
    <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex justify-between items-center shadow-sm transition-all">
        <div class="font-black text-xl tracking-tighter cursor-pointer flex items-center gap-1 max-w-6xl mx-auto w-full" onclick="window.scrollTo(0,0)">
            <div class="flex-1">KOS <span class="text-blue-600">SPORT</span></div>
            <div class="flex items-center gap-2 justify-end">
                <div class="relative group">
                    <input type="text" id="searchInput" placeholder="Поиск" class="bg-gray-100 border-none rounded-full py-2 px-4 text-sm w-28 focus:w-48 sm:focus:w-64 focus:bg-white focus:ring-2 focus:ring-blue-500 transition-all outline-none">
                    <i class="fas fa-search absolute right-3 top-2.5 text-gray-400 text-xs pointer-events-none"></i>
                </div>
                <button onclick="toggleCart()" class="relative p-2 active:scale-90 transition-transform">
                    <i class="fas fa-shopping-bag text-xl"></i>
                    <span id="cartBadge" class="absolute top-0 right-0 bg-blue-600 text-white text-[10px] font-bold h-4 w-4 flex items-center justify-center rounded-full opacity-0 transition-opacity">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Главная страница (Каталог) -->
    <main class="max-w-6xl mx-auto p-4 w-full" id="mainContent">
        <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1 -mx-4 px-4 sticky top-[60px] z-30 bg-gray-50/95 backdrop-blur-sm py-2">
            <button onclick="filter('All')" class="cat-btn bg-black text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">Все</button>
            <button onclick="filter('Shoes')" class="cat-btn bg-white border text-gray-700 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Обувь</button>
            <button onclick="filter('Apparel')" class="cat-btn bg-white border text-gray-700 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Форма</button>
            <button onclick="filter('Equipment')" class="cat-btn bg-white border text-gray-700 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Инвентарь</button>
        </div>
        <div id="loader" class="flex justify-center py-20"><i class="fas fa-circle-notch fa-spin text-3xl text-blue-600"></i></div>
        <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 lg:gap-6"></div>
    </main>

    <!-- Затенение для мобилок -->
    <div id="modalBackdrop" class="fixed inset-0 bg-black/60 z-50 hidden md:hidden transition-opacity" onclick="closeProduct()"></div>

    <!-- СТРАНИЦА ПРОДУКТА (Adaptive: Sheet on Mobile, Full Page on Desktop) -->
    <div id="productView" class="product-view shadow-[0_-5px_40px_rgba(0,0,0,0.3)] md:shadow-none">
        
        <!-- Ползунок закрытия для мобильных -->
        <div class="md:hidden w-full flex justify-center pt-3 pb-1" onclick="closeProduct()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full"></div>
        </div>

        <!-- Шапка для ПК (Кнопка Назад) -->
        <div class="hidden md:flex items-center justify-between p-4 px-8 bg-white border-b sticky top-0 z-20">
            <div class="max-w-6xl mx-auto w-full">
                <button onclick="closeProduct()" class="flex items-center gap-2 text-gray-600 hover:text-black font-bold transition-colors">
                    <i class="fas fa-arrow-left"></i> Назад в каталог
                </button>
            </div>
        </div>

        <!-- Контент продукта -->
        <div class="flex-1 overflow-y-auto md:overflow-visible pb-24 md:pb-10">
            <div class="md:max-w-5xl md:mx-auto md:p-8 md:mt-4 md:grid md:grid-cols-2 md:gap-12">
                
                <!-- ЛЕВАЯ ЧАСТЬ: Фотографии -->
                <div class="w-full relative">
                    <button onclick="closeProduct()" class="md:hidden absolute top-4 right-4 z-50 bg-white/80 backdrop-blur-sm p-2 rounded-full shadow-sm active:scale-90">
                        <i class="fas fa-times text-gray-600"></i>
                    </button>
                    <div class="swiper mySwiper w-full h-[45vh] md:h-[600px] bg-gray-50 md:rounded-3xl border border-gray-100 overflow-hidden">
                        <div class="swiper-wrapper" id="modalSwiperWrapper"></div>
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <!-- ПРАВАЯ ЧАСТЬ: Детали товара -->
                <div class="p-5 md:p-0 flex flex-col justify-center">
                    
                    <!-- Бейджи (Как на фото) -->
                    <div class="flex gap-2 mb-3">
                        <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs font-bold uppercase" id="mCategory"></span>
                        <span class="bg-green-50 text-green-600 px-2 py-1 rounded text-xs font-bold uppercase hidden md:inline-block">В наличии</span>
                    </div>

                    <!-- Название и Цена -->
                    <h1 id="mName" class="text-2xl md:text-3xl font-black text-gray-900 leading-tight mb-2"></h1>
                    <div id="mPrice" class="text-2xl md:text-3xl font-bold text-gray-900 mb-6"></div>

                    <!-- Выбор размера -->
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-500 mb-3">Размер</label>
                        <div id="mSizes" class="flex flex-wrap gap-2 mb-2"></div>
                        <p class="text-xs text-gray-400 mt-1" id="sizeHelper">Выберите размер</p>
                    </div>

                    <!-- Инфо панель (Как на фото) -->
                    <div class="hidden md:flex justify-between items-center bg-gray-50 rounded-2xl p-5 border border-gray-100 mb-8">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-trophy text-green-500 text-xl"></i>
                            <span class="text-xs font-medium text-gray-700 leading-tight">Профессиональная<br>экипировка</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <i class="fas fa-sync-alt text-green-500 text-xl"></i>
                            <span class="text-xs font-medium text-gray-700">Обмен и возврат</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <i class="fab fa-telegram-plane text-green-500 text-xl"></i>
                            <span class="text-xs font-medium text-gray-700 leading-tight">Поддержка в<br>Telegram</span>
                        </div>
                    </div>

                    <!-- Действия (На ПК тут, на мобилке fixed bottom) -->
                    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-100 md:relative md:border-t-0 md:p-0 md:bg-transparent flex gap-3 z-50">
                        <div class="flex items-center border border-gray-200 rounded-xl h-14 md:h-14 bg-gray-50 shrink-0">
                            <button onclick="updateQty(-1)" class="w-12 h-full flex items-center justify-center text-xl font-bold text-gray-500 active:bg-gray-200 rounded-l-xl">-</button>
                            <span id="mQty" class="w-8 text-center font-bold text-lg">1</span>
                            <button onclick="updateQty(1)" class="w-12 h-full flex items-center justify-center text-xl font-bold text-gray-500 active:bg-gray-200 rounded-r-xl">+</button>
                        </div>
                        <button onclick="addToCart()" class="flex-1 bg-black text-white h-14 rounded-xl font-bold text-base shadow-lg active:scale-95 transition-transform hover:bg-gray-800 flex items-center justify-center gap-2">
                            <span>В корзину</span>
                        </button>
                    </div>

                    <!-- Описание -->
                    <div class="mt-6 md:mt-8 mb-4">
                        <h3 class="font-bold text-gray-900 text-base mb-2">Описание</h3>
                        <p id="mDesc" class="text-gray-600 text-sm leading-relaxed"></p>
                    </div>

                    <!-- Таблица размеров -->
                    <div class="mt-4 bg-gray-50 rounded-xl border border-gray-100 overflow-hidden">
                        <button onclick="toggleSizeChart()" class="w-full flex justify-between items-center p-4 text-sm font-bold text-gray-900 uppercase active:bg-gray-100 transition-colors">
                            <span class="flex items-center gap-2"><i class="fas fa-ruler-combined"></i> Таблица размеров</span>
                            <i class="fas fa-chevron-down transition-transform duration-300" id="sizeChartArrow"></i>
                        </button>
                        <div id="sizeChartContainer" class="hidden px-4 pb-4 pt-0 border-t border-gray-200 overflow-x-auto"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- КОРЗИНА -->
    <div id="cartOverlay" class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
    <div id="cartPanel" class="fixed inset-y-0 right-0 w-full max-w-sm bg-white z-[70] transform translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-5 border-b flex justify-between items-center bg-gray-50">
            <h2 class="text-lg font-black uppercase tracking-tight">Корзина <span id="cartHeaderCount" class="text-blue-600 ml-1"></span></h2>
            <button onclick="toggleCart()" class="p-2 bg-white rounded-full shadow-sm hover:bg-gray-100"><i class="fas fa-times text-lg"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-5 border-t bg-white pb-8 safe-area-pb">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500 font-medium text-sm">Итого к оплате</span>
                <span id="cartTotal" class="text-xl font-black text-gray-900">0 сум</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold uppercase shadow-blue-200 shadow-lg active:scale-95 transition-transform hover:bg-blue-700">
                Оформить заказ
            </button>
        </div>
    </div>

    <!-- АДМИН ПАНЕЛЬ -->
    <div id="adminModal" class="fixed inset-0 z-[100] bg-gray-100 hidden overflow-y-auto p-4 md:p-8">
        <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden pb-10">
            <div class="p-4 border-b flex justify-between items-center bg-gray-900 text-white sticky top-0 z-10">
                <h2 class="font-bold flex items-center gap-2"><i class="fas fa-database"></i> Панель управления</h2>
                <button onclick="closeAdmin()" class="text-xs bg-gray-700 px-3 py-1.5 rounded hover:bg-gray-600 transition-colors">Закрыть</button>
            </div>
            
            <div class="p-4 space-y-6 md:flex md:gap-6 md:space-y-0">
                <form id="addForm" class="space-y-4 md:w-1/2">
                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 shadow-sm transition-all" id="formWrapper">
                        <h3 id="formTitle" class="font-bold text-blue-800 mb-3 text-sm uppercase">Новый товар</h3>
                        
                        <div class="space-y-3">
                            <input type="text" id="aName" placeholder="Название товара" required class="w-full border-gray-200 border p-3 rounded-lg text-sm outline-none focus:border-blue-500">
                            
                            <div class="grid grid-cols-2 gap-3">
                                <input type="number" id="aPrice" placeholder="Цена (сум)" required class="w-full border-gray-200 border p-3 rounded-lg text-sm outline-none focus:border-blue-500">
                                <select id="aCat" class="w-full border-gray-200 border p-3 rounded-lg text-sm bg-white outline-none focus:border-blue-500">
                                    <option value="" disabled selected>Категория</option>
                                    <option value="Shoes">Обувь</option>
                                    <option value="Apparel">Форма</option>
                                    <option value="Equipment">Экипировка</option>
                                    <option value="Accessories">Аксессуары</option>
                                </select>
                            </div>

                            <textarea id="aDesc" placeholder="Описание..." class="w-full border-gray-200 border p-3 rounded-lg text-sm h-20 outline-none resize-none focus:border-blue-500"></textarea>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Фотографии (Макс 10)</label>
                                <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 text-center bg-white cursor-pointer hover:bg-gray-50 transition-colors relative">
                                    <input type="file" id="aPhotos" multiple accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
                                    <div class="text-gray-400 text-xs font-bold pointer-events-none">
                                        <i class="fas fa-camera text-xl mb-1 block"></i> Нажмите для выбора
                                    </div>
                                </div>
                                <div id="photoPreviewContainer" class="grid grid-cols-4 gap-2 mt-2"></div>
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-500 mb-1">Размерная таблица</label>
                                <textarea id="aSizeChartText" class="w-full border-gray-200 border p-3 rounded-lg text-sm h-24 outline-none resize-none font-mono text-xs whitespace-pre bg-gray-50" placeholder="Выберите категорию для автозаполнения"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-4">
                            <button type="submit" id="saveBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform hover:bg-blue-700">СОХРАНИТЬ В БАЗУ</button>
                            <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-gray-400 text-white px-4 py-3 rounded-lg font-bold text-sm shadow-md active:scale-95 transition-transform hover:bg-gray-500">ОТМЕНА</button>
                        </div>
                    </div>
                </form>

                <div class="md:w-1/2 md:border-l md:border-gray-200 md:pl-6 md:max-h-[75vh] md:overflow-y-auto hide-scrollbar">
                    <h3 class="font-bold text-gray-400 text-xs uppercase mb-3 px-1 sticky top-0 bg-white z-10 py-2">Управление товарами</h3>
                    <div id="adminList" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let products = [];
        let cart = [];
        let currentProduct = null;
        let selectedSize = null;
        let qty = 1;
        let uploadedImages = [];
        let productSwiper = null; 
        const SECRET_CODE = "4443";
        let editMode = false;
        let editProductId = null;
        let originalSizes = null;

        // Поиск
        document.addEventListener('click', (e) => {
            const searchContainer = document.getElementById('searchInput').parentElement;
            if (!searchContainer.contains(e.target) && document.activeElement === document.getElementById('searchInput')) {
                document.getElementById('searchInput').blur();
            }
        });

        // Открытие/закрытие таблицы
        function toggleSizeChart() {
            const container = document.getElementById('sizeChartContainer');
            const arrow = document.getElementById('sizeChartArrow');
            container.classList.toggle('hidden');
            arrow.style.transform = container.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        }

        // Автозаполнение
        document.getElementById('aCat').addEventListener('change', function() {
            const textArea = document.getElementById('aSizeChartText');
            if (this.value === 'Apparel') {
                textArea.value = "O'LCHAM,SON,BO'Y SM,VAZN KG\nS,46,167-175,59-66\nM,48,171-179,67-75\nL,50,175-185,74-80\nXL,52,175-189,80-88\nXXL,54,175-190,86-95";
            } else if (this.value === 'Shoes') {
                textArea.value = "Размер,Стопа (см)\n38,24.5\n39,25.0\n40,25.5\n41,26.5\n42,27.0\n43,27.5\n44,28.5\n45,29.5";
            } else if (this.value === 'Equipment') {
                textArea.value = "Стандарт,Размер\nOneSize,Универсальный";
            } else { textArea.value = ""; }
        });

        // API
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                renderGrid(products);
            } catch (e) { console.error(e); } 
            finally { document.getElementById('loader').classList.add('hidden'); }
        }

        async function saveProduct(prod) {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Сохранение...';
            btn.disabled = true;
            try {
                await fetch('/api/products', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(prod) });
                await loadProducts();
                renderAdminList();
                if (editMode) { cancelEdit(); alert('Изменения сохранены!'); } 
                else { resetForm(); alert('Товар успешно добавлен!'); }
            } catch (e) { alert('Ошибка сохранения'); }
            finally { if (!editMode) btn.innerHTML = originalText; btn.disabled = false; }
        }

        function resetForm() {
            document.getElementById('addForm').reset();
            uploadedImages = [];
            renderPhotoPreview();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            editMode = true;
            editProductId = prod.id;
            originalSizes = { ...prod.sizes };

            document.getElementById('aName').value = prod.name;
            document.getElementById('aPrice').value = prod.price;
            document.getElementById('aCat').value = prod.category;
            document.getElementById('aDesc').value = prod.description || '';
            document.getElementById('aSizeChartText').value = prod.sizeChart || '';

            uploadedImages = [...prod.images];
            renderPhotoPreview();

            document.getElementById('formWrapper').classList.replace('bg-blue-50', 'bg-yellow-50');
            document.getElementById('formWrapper').classList.replace('border-blue-100', 'border-yellow-200');
            document.getElementById('formTitle').innerText = '✏️ Редактирование товара';
            document.getElementById('formTitle').classList.replace('text-blue-800', 'text-yellow-800');
            document.getElementById('saveBtn').innerText = 'СОХРАНИТЬ ИЗМЕНЕНИЯ';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('adminModal').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editMode = false;
            editProductId = null;
            originalSizes = null;
            resetForm();
            document.getElementById('formWrapper').classList.replace('bg-yellow-50', 'bg-blue-50');
            document.getElementById('formWrapper').classList.replace('border-yellow-200', 'border-blue-100');
            document.getElementById('formTitle').innerText = 'Новый товар';
            document.getElementById('formTitle').classList.replace('text-yellow-800', 'text-blue-800');
            document.getElementById('saveBtn').innerText = 'СОХРАНИТЬ В БАЗУ';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteProduct(id) {
            if(!confirm('Удалить этот товар навсегда?')) return;
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            if (editMode && editProductId === id) cancelEdit();
            await loadProducts();
            renderAdminList();
        }

        async function toggleStock(id, status) {
            await fetch('/api/stock', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, status: !status}) });
            await loadProducts();
            renderAdminList();
        }

        async function toggleSizeStock(id, size, status) {
            await fetch('/api/size', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, size, status: !status}) });
            await loadProducts();
            renderAdminList();
        }

        // РЕНДЕР КАТАЛОГА
        function renderGrid(items) {
            const grid = document.getElementById('productGrid');
            if(items.length === 0) { grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10 text-sm">Товаров пока нет</div>'; return; }
            grid.innerHTML = items.map(p => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer hover:shadow-md active:scale-[0.98] transition-all" onclick="openProduct('${p.id}')">
                    <div class="aspect-[4/5] relative bg-gray-50 group">
                        <img src="${p.images[0]}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        ${!p.isAvailable ? '<div class="absolute inset-0 bg-white/80 backdrop-blur-[1px] flex items-center justify-center"><span class="bg-gray-900 text-white px-3 py-1 text-[10px] font-bold uppercase rounded-full">Продано</span></div>' : ''}
                    </div>
                    <div class="p-3">
                        <p class="text-[10px] text-gray-400 mb-1 uppercase font-bold tracking-wider truncate">${translateCat(p.category)}</p>
                        <h3 class="font-bold text-sm leading-tight mb-2 line-clamp-1">${p.name}</h3>
                        <p class="text-blue-600 font-bold text-sm">${formatMoney(p.price)}</p>
                    </div>
                </div>
            `).join('');
        }

        // ОТКРЫТИЕ СТРАНИЦЫ ТОВАРА
        function openProduct(id) {
            currentProduct = products.find(p => p.id === id);
            if(!currentProduct) return;
            
            selectedSize = null;
            qty = 1;
            document.getElementById('mQty').innerText = 1;
            document.getElementById('sizeHelper').innerText = 'Выберите размер';
            document.getElementById('sizeHelper').classList.replace('text-red-500', 'text-gray-400');
            
            document.getElementById('sizeChartContainer').classList.add('hidden');
            document.getElementById('sizeChartArrow').style.transform = 'rotate(0deg)';

            document.getElementById('mName').innerText = currentProduct.name;
            document.getElementById('mPrice').innerText = formatMoney(currentProduct.price);
            document.getElementById('mCategory').innerText = translateCat(currentProduct.category);
            
            const descEl = document.getElementById('mDesc');
            descEl.innerText = currentProduct.description || "Описание отсутствует.";

            const scContainer = document.getElementById('sizeChartContainer');
            if (currentProduct.sizeChart && currentProduct.sizeChart.includes(',')) {
                scContainer.innerHTML = generateTableFromCSV(currentProduct.sizeChart);
            } else {
                scContainer.innerHTML = `<div class="text-xs text-gray-500 py-2">${currentProduct.sizeChart || 'Таблица не указана'}</div>`;
            }

            const wrapper = document.getElementById('modalSwiperWrapper');
            wrapper.innerHTML = currentProduct.images.map(img => `
                <div class="swiper-slide bg-white flex items-center justify-center p-0 md:p-6"><img src="${img}" class="w-full h-full object-contain"></div>
            `).join('');
            
            if (productSwiper) productSwiper.destroy(true, true);
            productSwiper = new Swiper(".mySwiper", { initialSlide: 0, spaceBetween: 10, pagination: { el: ".swiper-pagination", clickable: true } });

            const sizesContainer = document.getElementById('mSizes');
            const sortedSizes = sortSizes(Object.keys(currentProduct.sizes));
            
            sizesContainer.innerHTML = sortedSizes.map(s => {
                const avail = currentProduct.sizes[s];
                // Квадратные кнопки (как на фото)
                return `<button onclick="selectSize('${s}')" class="size-btn border border-gray-200 rounded-lg w-12 h-12 flex items-center justify-center text-sm font-medium transition-all hover:border-black ${!avail || !currentProduct.isAvailable ? 'opacity-30 cursor-not-allowed bg-gray-50 hover:border-gray-200' : 'bg-white text-gray-700'}" ${!avail || !currentProduct.isAvailable ? 'disabled' : ''} data-size="${s}">${s}</button>`;
            }).join('');

            const modal = document.getElementById('productView');
            document.getElementById('modalBackdrop').classList.remove('hidden');
            setTimeout(() => { modal.classList.add('open'); }, 10);
        }

        function generateTableFromCSV(text) {
            const rows = text.trim().split('\n');
            if (rows.length === 0) return '';
            let html = '<table class="size-table">';
            rows.forEach((row, index) => {
                const cols = row.split(',');
                html += '<tr>';
                cols.forEach(col => {
                    if (index === 0) html += `<th>${col.trim()}</th>`;
                    else html += `<td>${col.trim()}</td>`;
                });
                html += '</tr>';
            });
            html += '</table>';
            return html;
        }

        function closeProduct() {
            const modal = document.getElementById('productView');
            modal.classList.remove('open');
            setTimeout(() => { document.getElementById('modalBackdrop').classList.add('hidden'); }, 300);
        }

        function selectSize(size) {
            selectedSize = size;
            document.querySelectorAll('.size-btn').forEach(b => {
                if(b.disabled) return;
                b.classList.remove('ring-2', 'ring-black', 'border-black');
                b.classList.add('border-gray-200');
                if(b.dataset.size === size) {
                    b.classList.remove('border-gray-200');
                    b.classList.add('ring-2', 'ring-black', 'border-black');
                }
            });
            document.getElementById('sizeHelper').innerText = 'Размер выбран';
            document.getElementById('sizeHelper').classList.replace('text-red-500', 'text-green-600');
        }

        function updateQty(d) {
            qty = Math.max(1, qty + d);
            document.getElementById('mQty').innerText = qty;
        }

        function addToCart() {
            if(!selectedSize) { 
                try { tg.HapticFeedback.notificationOccurred('error'); } catch(e){}
                document.getElementById('sizeHelper').innerText = 'Пожалуйста, выберите размер!';
                document.getElementById('sizeHelper').classList.replace('text-gray-400', 'text-red-500');
                document.getElementById('sizeHelper').classList.replace('text-green-600', 'text-red-500');
                return; 
            }
            cart.push({ ...currentProduct, cartId: Date.now(), selectedSize, qty });
            closeProduct();
            updateCart();
            try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
        }

        function updateCart() {
            const cnt = document.getElementById('cartItems');
            const badge = document.getElementById('cartBadge');
            const totalEl = document.getElementById('cartTotal');
            
            badge.innerText = cart.length;
            badge.classList.toggle('opacity-0', cart.length===0);
            
            const headerCount = document.getElementById('cartHeaderCount');
            if(headerCount) headerCount.innerText = cart.length > 0 ? `(${cart.length})` : '';

            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            totalEl.innerText = formatMoney(total);

            if(cart.length === 0) {
                cnt.innerHTML = '<div class="text-center text-gray-400 mt-20 text-sm">Корзина пуста</div>';
            } else {
                cnt.innerHTML = cart.map((i, idx) => `
                    <div class="flex gap-3 bg-gray-50 p-2 rounded-xl border border-gray-100">
                        <img src="${i.images[0]}" class="w-16 h-16 object-cover rounded-lg bg-white border border-gray-100">
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start">
                                <h4 class="font-bold text-sm truncate mr-2">${i.name}</h4>
                                <button onclick="removeFromCart(${idx})" class="text-gray-400 p-1 hover:text-red-500 transition-colors"><i class="fas fa-times"></i></button>
                            </div>
                            <p class="text-xs text-gray-500 mb-1">Размер: <b class="text-gray-700">${i.selectedSize}</b></p>
                            <div class="flex justify-between items-center">
                                <span class="text-blue-600 font-bold text-sm">${formatMoney(i.price * i.qty)}</span>
                                <span class="text-[10px] bg-white border px-2 py-0.5 rounded text-gray-600 font-bold">x${i.qty}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            if (total > 0) {
                tg.MainButton.setText(`ОФОРМИТЬ: ${formatMoney(total)}`);
                tg.MainButton.show();
            } else { tg.MainButton.hide(); }
        }

        function removeFromCart(idx) { cart.splice(idx, 1); updateCart(); }

        function sendOrder() {
            if(cart.length === 0) return;
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const data = { total_price: total, items: cart.map(i => ({ name: i.name, price: i.price, qty: i.qty, size: i.selectedSize })) };
            tg.sendData(JSON.stringify(data));
        }
        
        tg.onEvent('mainButtonClicked', sendOrder);

        // --- ADMIN Скрипты ---
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value;
            if(val === SECRET_CODE) { openAdminPanel(); e.target.value = ''; e.target.blur(); } 
            else { renderGrid(products.filter(p => p.name.toLowerCase().includes(val.toLowerCase()))); }
        });

        document.getElementById('aPhotos').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files).slice(0, 10);
            for (let file of files) { uploadedImages.push(await resizeImage(file)); }
            renderPhotoPreview();
        });

        function renderPhotoPreview() {
            const container = document.getElementById('photoPreviewContainer');
            container.innerHTML = uploadedImages.map((img, idx) => `
                <div class="relative group aspect-square rounded-lg overflow-hidden border border-gray-200 shadow-sm">
                    <img src="${img}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        ${idx > 0 ? `<button type="button" onclick="movePhoto(${idx}, -1)" class="text-white hover:text-blue-400 p-1"><i class="fas fa-arrow-left"></i></button>` : ''}
                        <button type="button" onclick="removePhoto(${idx})" class="text-red-400 hover:text-red-500 p-1"><i class="fas fa-trash"></i></button>
                        ${idx < uploadedImages.length - 1 ? `<button type="button" onclick="movePhoto(${idx}, 1)" class="text-white hover:text-blue-400 p-1"><i class="fas fa-arrow-right"></i></button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.movePhoto = (index, direction) => {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < uploadedImages.length) {
                [uploadedImages[index], uploadedImages[newIndex]] = [uploadedImages[newIndex], uploadedImages[index]];
                renderPhotoPreview();
            }
        };

        window.removePhoto = (index) => { uploadedImages.splice(index, 1); renderPhotoPreview(); };

        function resizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const scale = 800 / img.width;
                        canvas.width = 800; canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('addForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if(uploadedImages.length === 0) { alert('Нужно хотя бы 1 фото'); return; }

            const cat = document.getElementById('aCat').value;
            let sizes = {};
            
            if (editMode && originalSizes) {
                const existingProd = products.find(p => p.id === editProductId);
                if (existingProd && existingProd.category === cat) { sizes = { ...originalSizes }; } 
                else { sizes = generateSizesForCat(cat); }
            } else { sizes = generateSizesForCat(cat); }

            const prod = {
                id: editMode ? editProductId : 'p' + Date.now(), 
                name: document.getElementById('aName').value, 
                price: parseFloat(document.getElementById('aPrice').value),
                description: document.getElementById('aDesc').value, 
                category: cat, images: uploadedImages, sizes: sizes,
                isAvailable: 1, sizeChart: document.getElementById('aSizeChartText').value
            };

            if (editMode) {
                const existingProd = products.find(p => p.id === editProductId);
                if (existingProd) prod.isAvailable = existingProd.isAvailable;
            }
            saveProduct(prod);
        });

        function generateSizesForCat(cat) {
            let sizes = {};
            if(cat === 'Shoes') { for(let i=35; i<=45; i++) sizes[i] = true; }
            else if(cat === 'Apparel') { ['S','M','L','XL','2XL'].forEach(s => sizes[s]=true); }
            else if(cat === 'Equipment') { [10,15,20,22,28,30].forEach(s => sizes[s]=true); }
            else { sizes['Standard'] = true; }
            return sizes;
        }

        function renderAdminList() {
            const list = document.getElementById('adminList');
            list.innerHTML = products.map(p => `
                <div class="bg-white border border-gray-200 p-3 rounded-xl mb-3 shadow-sm hover:shadow transition-shadow">
                    <div class="flex gap-3 mb-3">
                        <img src="${p.images[0]}" class="w-16 h-16 object-cover rounded-lg bg-gray-100 border border-gray-100 shrink-0">
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="font-bold text-sm truncate mb-0.5" title="${p.name}">${p.name}</div>
                            <div class="text-blue-600 font-bold text-xs mb-1">${formatMoney(p.price)}</div>
                            <div class="text-[10px] text-gray-500 uppercase tracking-wide truncate">${translateCat(p.category)}</div>
                        </div>
                        <div class="flex flex-col gap-1 items-end shrink-0">
                            <button onclick="toggleStock('${p.id}', ${p.isAvailable})" class="w-[85px] py-1.5 rounded-md text-[9px] font-bold border transition-colors ${p.isAvailable ? 'bg-green-50 text-green-700 border-green-200 hover:bg-green-100' : 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100'}">${p.isAvailable ? 'В НАЛИЧИИ' : 'ПРОДАНО'}</button>
                            <div class="flex gap-1 mt-1 w-[85px]">
                                <button onclick="editProduct('${p.id}')" title="Редактировать" class="flex-1 text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-md h-7 flex items-center justify-center transition-colors"><i class="fas fa-pencil-alt text-xs"></i></button>
                                <button onclick="deleteProduct('${p.id}')" title="Удалить" class="flex-1 text-red-500 bg-red-50 hover:bg-red-100 rounded-md h-7 flex items-center justify-center transition-colors"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-2 border-t border-gray-100">
                        ${Object.keys(p.sizes).sort().map(s => `<button onclick="toggleSizeStock('${p.id}', '${s}', ${p.sizes[s]})" class="px-2 py-1 text-[10px] font-bold border rounded transition-colors ${p.sizes[s] ? 'bg-gray-800 text-white border-gray-800 hover:bg-gray-700' : 'bg-white text-gray-400 border-gray-200 line-through hover:bg-gray-50'}">${s}</button>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function formatMoney(n) { return new Intl.NumberFormat('ru-RU').format(n) + ' сум'; }
        function translateCat(c) { const map={'Shoes':'Обувь','Apparel':'Форма','Equipment':'Экипировка','Accessories':'Аксессуары'}; return map[c]||c; }
        function toggleCart() { document.getElementById('cartOverlay').classList.toggle('hidden'); document.getElementById('cartPanel').classList.toggle('translate-x-full'); }
        function openAdminPanel() { renderAdminList(); document.getElementById('adminModal').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('adminModal').classList.add('hidden'); }
        function sortSizes(keys) {
            const order = ['S','M','L','XL','2XL', 'XXL'];
            return keys.sort((a,b) => {
                const nA = parseFloat(a), nB = parseFloat(b);
                if(!isNaN(nA) && !isNaN(nB)) return nA - nB;
                return order.indexOf(a) - order.indexOf(b);
            });
        }
        function filter(cat) { 
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-black','text-white', 'shadow-sm'); b.classList.add('bg-white','text-gray-700', 'border'); 
                if(b.innerText.includes(cat === 'All' ? 'Все' : (cat==='Shoes'?'Обувь':(cat==='Apparel'?'Форма':(cat==='Equipment'?'Инвентарь':''))))) {
                    b.classList.add('bg-black','text-white', 'shadow-sm'); b.classList.remove('bg-white','text-gray-700', 'border');
                }
            });
            renderGrid(cat === 'All' ? products : products.filter(p => p.category === cat));
        }
        
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
