<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOS Sport Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-blue-100">
    <!-- Nav -->
    <nav class="sticky top-0 z-50 bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <div class="font-black text-2xl tracking-tighter">KOS <span class="text-blue-600">SPORT</span></div>
        <div class="flex items-center gap-4">
            <input type="text" id="search" placeholder="Поиск..." class="border rounded-full px-4 py-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="toggleCart()" class="relative">
                <i class="fas fa-shopping-bag text-xl"></i>
                <span id="badge" class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] rounded-full px-1.5 opacity-0 transition-opacity">0</span>
            </button>
        </div>
    </nav>

    <!-- Main Grid -->
    <main class="p-4 max-w-7xl mx-auto flex-grow w-full">
        <div id="loading" class="loader"></div>
        <div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </main>

    <!-- Cart Panel -->
    <div id="cartOverlay" class="fixed inset-0 bg-black/50 z-[60] hidden backdrop-blur-sm" onclick="toggleCart()"></div>
    <div id="cartPanel" class="fixed inset-y-0 right-0 w-full max-w-md bg-white z-[70] transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-xl font-bold">Корзина</h2>
            <button onclick="toggleCart()"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-6 border-t bg-gray-50">
            <div class="flex justify-between font-bold text-lg mb-4"><span>Итого</span><span id="cartTotal">0 UZS</span></div>
            <p class="text-xs text-center text-gray-400">Нажмите ЗАКАЗАТЬ в меню Telegram</p>
        </div>
    </div>

    <!-- Admin (Secret 4443) -->
    <div id="adminModal" class="fixed inset-0 bg-gray-100 z-[100] hidden overflow-y-auto p-4">
        <div class="max-w-3xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Склад KOS</h2>
                <button onclick="closeAdmin()" class="border px-4 py-1 rounded-full bg-white">Закрыть</button>
            </div>
            <form id="addForm" class="bg-white p-6 rounded-2xl shadow-sm mb-8 space-y-4">
                <input type="text" id="aName" placeholder="Название" required class="w-full border p-3 rounded-xl">
                <div class="flex gap-4">
                    <input type="number" id="aPrice" placeholder="Цена" required class="w-full border p-3 rounded-xl">
                    <select id="aCat" class="w-full border p-3 rounded-xl">
                        <option value="Shoes">Обувь</option>
                        <option value="Apparel">Одежда</option>
                        <option value="Equipment">Инвентарь</option>
                        <option value="Accessories">Аксессуары</option>
                    </select>
                </div>
                <input type="text" id="aImg" placeholder="URL картинки" class="w-full border p-3 rounded-xl">
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">СОХРАНИТЬ</button>
            </form>
            <div id="adminList" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let products = [];
        let cart = [];

        async function loadData() {
            document.getElementById('loading').style.display = 'block';
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                renderGrid();
            } catch (e) { console.error("API Error", e); }
            finally { document.getElementById('loading').style.display = 'none'; }
        }

        function renderGrid() {
            const container = document.getElementById('grid');
            container.innerHTML = products.map(p => `
                <div class="bg-white border rounded-2xl p-2 active:scale-95 transition-transform" onclick="addToCart('${p.id}')">
                    <div class="aspect-square rounded-xl overflow-hidden bg-gray-50 mb-2">
                        <img src="${p.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="font-bold text-sm truncate px-1">${p.name}</div>
                    <div class="text-blue-600 font-bold text-xs px-1">${p.price.toLocaleString()} UZS</div>
                </div>
            `).join('');
        }

        // Search Admin Trigger
        document.getElementById('search').addEventListener('input', e => {
            if(e.target.value === '4443') {
                document.getElementById('adminModal').classList.remove('hidden');
                renderAdminList();
                e.target.value = '';
            }
        });

        function closeAdmin() { document.getElementById('adminModal').classList.add('hidden'); }

        async function renderAdminList() {
            const list = document.getElementById('adminList');
            list.innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-xl border flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-10 h-10 rounded object-cover">
                        <span class="font-bold text-sm">${p.name}</span>
                    </div>
                    <button onclick="deleteProd('${p.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        async function deleteProd(id) {
            if(!confirm("Удалить из базы?")) return;
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            await loadData(); renderAdminList();
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const prod = {
                id: 'p' + Date.now(),
                name: document.getElementById('aName').value,
                price: parseFloat(document.getElementById('aPrice').value),
                category: document.getElementById('aCat').value,
                image: document.getElementById('aImg').value || 'https://via.placeholder.com/300',
                isAvailable: 1,
                sizes: { 'Standard': true }
            };
            await fetch('/api/products', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(prod)
            });
            await loadData(); renderAdminList(); e.target.reset();
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            cart.push({...p, qty: 1, cartId: Date.now()});
            updateCart();
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCart() {
            const b = document.getElementById('badge');
            b.innerText = cart.length;
            b.style.opacity = cart.length > 0 ? '1' : '0';
            
            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('cartTotal').innerText = total.toLocaleString() + ' UZS';

            document.getElementById('cartItems').innerHTML = cart.map((i, idx) => `
                <div class="flex gap-4 border-b pb-2">
                    <img src="${i.image}" class="w-12 h-12 rounded object-cover">
                    <div class="flex-1">
                        <div class="font-bold text-sm">${i.name}</div>
                        <div class="text-xs text-gray-400">${i.price.toLocaleString()} UZS</div>
                    </div>
                    <button onclick="cart.splice(${idx},1); updateCart();" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');

            if(total > 0) {
                tg.MainButton.setText(`ЗАКАЗАТЬ: ${total.toLocaleString()} UZS`);
                tg.MainButton.show();
            } else tg.MainButton.hide();
        }

        function toggleCart() {
            const p = document.getElementById('cartPanel');
            const o = document.getElementById('cartOverlay');
            if(o.classList.contains('hidden')) {
                o.classList.remove('hidden');
                setTimeout(() => p.classList.remove('translate-x-full'), 10);
            } else {
                p.classList.add('translate-x-full');
                setTimeout(() => o.classList.add('hidden'), 300);
            }
        }

        tg.onEvent('mainButtonClicked', () => {
            tg.sendData(json.stringify({ items: cart.map(i => ({ name: i.name, price: i.price, qty: i.qty, size: '-' })) }));
        });

        window.onload = loadData;
    </script>
</body>
</html>
