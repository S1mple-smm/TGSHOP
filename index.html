<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOS Sport Web App</title>
    <!-- Подключение Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #000000); font-family: sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Шапка -->
    <nav class="sticky top-0 z-50 bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <div class="font-black text-xl tracking-tighter">KOS <span class="text-blue-600">SPORT</span></div>
        <div class="flex items-center gap-4">
            <input type="text" id="searchInput" placeholder="Поиск..." class="border rounded-full px-4 py-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button onclick="openCart()" class="relative">
                <i class="fas fa-shopping-bag text-xl"></i>
                <span id="badge" class="absolute -top-2 -right-2 bg-blue-600 text-white text-[10px] rounded-full px-1.5 opacity-0 transition-opacity">0</span>
            </button>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="p-4 flex-grow max-w-7xl mx-auto w-full">
        <div id="loading" class="flex flex-col items-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-500 text-sm">Загрузка товаров из базы...</p>
        </div>
        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </main>

    <!-- Админ-панель (Секретный код 4443) -->
    <div id="adminModal" class="fixed inset-0 bg-gray-100 z-[100] hidden overflow-y-auto p-4">
        <div class="max-w-2xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Склад / Админ</h2>
                <button onclick="document.getElementById('adminModal').classList.add('hidden')" class="text-blue-600 font-bold">Выйти</button>
            </div>
            
            <form id="addForm" class="bg-white p-6 rounded-2xl shadow-sm mb-6 space-y-4">
                <h3 class="font-bold border-b pb-2">Добавить новый товар</h3>
                <input type="text" id="aName" placeholder="Название товара" required class="w-full border p-3 rounded-xl">
                <div class="flex gap-4">
                    <input type="number" id="aPrice" placeholder="Цена (UZS)" required class="w-full border p-3 rounded-xl">
                    <select id="aCat" class="w-full border p-3 rounded-xl">
                        <option value="Shoes">Обувь</option>
                        <option value="Apparel">Одежда</option>
                    </select>
                </div>
                <input type="text" id="aImg" placeholder="URL картинки" class="w-full border p-3 rounded-xl">
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">СОХРАНИТЬ В ОБЛАКО</button>
            </form>

            <div id="adminList" class="space-y-2">
                <!-- Список товаров для удаления -->
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let products = [];
        let cart = [];

        // --- ФУНКЦИИ СВЯЗИ С БАЗОЙ ЧЕРЕЗ API ---
        async function loadData() {
            document.getElementById('loading').classList.remove('hidden');
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                renderGrid();
            } catch (e) {
                console.error("Ошибка при получении данных с сервера");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function deleteProduct(id) {
            if(!confirm("Удалить товар навсегда?")) return;
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            await loadData();
            renderAdminList();
        }

        // --- ЛОГИКА ИНТЕРФЕЙСА ---
        function renderGrid() {
            const container = document.getElementById('productGrid');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl p-2 border shadow-sm transition-transform active:scale-95" onclick="addToCart('${p.id}')">
                    <div class="aspect-square rounded-xl overflow-hidden bg-gray-50 mb-2">
                        <img src="${p.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="px-1">
                        <div class="font-bold text-sm truncate">${p.name}</div>
                        <div class="text-blue-600 font-bold text-xs mt-1">${p.price.toLocaleString()} UZS</div>
                    </div>
                </div>
            `).join('');
        }

        // Вызов админки
        document.getElementById('searchInput').addEventListener('input', e => {
            if(e.target.value === '4443') {
                document.getElementById('adminModal').classList.remove('hidden');
                renderAdminList();
                e.target.value = '';
            }
        });

        function renderAdminList() {
            const list = document.getElementById('adminList');
            list.innerHTML = products.map(p => `
                <div class="bg-white p-4 rounded-xl border flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-10 h-10 rounded object-cover">
                        <span class="font-bold text-sm">${p.name}</span>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const newProd = {
                id: 'p' + Date.now(),
                name: document.getElementById('aName').value,
                price: parseFloat(document.getElementById('aPrice').value),
                category: document.getElementById('aCat').value,
                image: document.getElementById('aImg').value || 'https://via.placeholder.com/300',
                isAvailable: 1,
                sizes: { 'Standard': true }
            };

            await fetch('/api/products', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(newProd)
            });

            e.target.reset();
            await loadData();
            renderAdminList();
            tg.HapticFeedback.notificationOccurred('success');
        };

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            cart.push(p);
            updateCart();
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateCart() {
            const badge = document.getElementById('badge');
            badge.innerText = cart.length;
            badge.style.opacity = cart.length > 0 ? '1' : '0';

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            if(total > 0) {
                tg.MainButton.setText(`ОФОРМИТЬ: ${total.toLocaleString()} UZS`);
                tg.MainButton.show();
            }
        }

        tg.onEvent('mainButtonClicked', () => {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            tg.sendData(JSON.stringify({ total: total, count: cart.length }));
        });

        // Старт
        window.onload = loadData;
    </script>
</body>
</html>
